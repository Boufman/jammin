<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Work Pal | Shift & Trip Logger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e0f0f;
      --panel:     #161818;
      --card:      #1c1f1f;
      --border:    #2a2e2e;
      --border2:   #3a3f3f;
      --amber:     #f5a623;
      --amber-dim: #a06a10;
      --green:     #3ecf74;
      --green-dim: #1f7040;
      --red:       #e05252;
      --red-dim:   #7a2a2a;
      --blue:      #5ba4f5;
      --blue-dim:  #2a4a80;
      --text:      #c8cccc;
      --text-dim:  #5a6060;
      --text-hi:   #eef0f0;
      --mono:      'Share Tech Mono', monospace;
      --sans:      'Barlow Condensed', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.4;
      padding-bottom: 80px;
    }

    /* Mobile-first layout */
    .container { max-width: 800px; margin: 0 auto; padding: 16px; }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 12px;
    }

    /* Status banner */
    .status-banner {
      background: var(--panel);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .status-item {
      flex: 1;
      min-width: 120px;
    }

    .status-label {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    .status-value {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-hi);
    }

    .status-value.active { color: var(--green); }
    .status-value.trip { color: var(--blue); }

    /* Buttons */
    .btn {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      width: 100%;
      text-align: center;
    }

    .btn-primary { background: var(--green); color: #0a1a10; }
    .btn-danger { background: var(--red); color: #1a0a0a; }
    .btn-warning { background: var(--amber); color: #1a0e00; }
    .btn-secondary { background: var(--blue); color: #0a1020; }
    .btn-outline { background: transparent; border: 1px solid var(--border2); color: var(--text); }

    .btn-group { display: flex; gap: 12px; margin-top: 12px; }
    .btn-group .btn { flex: 1; }

    /* Inputs */
    input, textarea, select {
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text-hi);
      font-family: var(--mono);
      font-size: 14px;
      padding: 12px;
      width: 100%;
      margin-bottom: 12px;
    }

    label {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    /* Trip card */
    .trip-active {
      border-left: 3px solid var(--blue);
      background: rgba(91,164,245,0.1);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--panel);
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    /* Camera preview */
    .camera-preview {
      width: 100%;
      height: auto;
      background: #000;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    video, #captureCanvas { width: 100%; border-radius: 12px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: var(--panel);
      border-left: 3px solid var(--green);
      border-radius: 8px;
      padding: 14px;
      z-index: 1100;
      transform: translateY(150%);
      transition: transform 0.3s ease;
      text-align: center;
    }
    .toast.show { transform: translateY(0); }

    /* Sync indicator */
    .sync-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red-dim);
    }
    .sync-dot.online { background: var(--green); }
    .sync-dot.syncing { animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; font-size: 12px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; }
    .badge-shift { background: var(--green-dim); color: var(--green); }
    .badge-trip { background: var(--blue-dim); color: var(--blue); }

    /* Utility */
    .text-center { text-align: center; }
    .mt-2 { margin-top: 8px; }
    .mb-2 { margin-bottom: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <!-- Status Banner -->
  <div class="status-banner">
    <div class="status-item">
      <div class="status-label">CURRENT SHIFT</div>
      <div class="status-value" id="shiftStatusText">Inactive</div>
    </div>
    <div class="status-item">
      <div class="status-label">ACTIVE TRIP</div>
      <div class="status-value" id="tripStatusText">None</div>
    </div>
    <div class="sync-status" id="syncStatus">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncText">Offline</span>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="btn-group">
    <button class="btn btn-primary" id="startTripBtn">🚗 Start Journey</button>
    <button class="btn btn-secondary" id="manualClockBtn">⏱ Manual Clock In</button>
  </div>

  <!-- Active Trip Card -->
  <div class="card" id="activeTripCard" style="display:none">
    <div class="card-title">📍 Active Journey</div>
    <div id="tripDestinationDisplay"></div>
    <div id="tripOdometerDisplay"></div>
    <div class="btn-group">
      <button class="btn btn-warning" id="arrivedBtn">📍 I've Arrived</button>
      <button class="btn btn-outline" id="cancelTripBtn">Cancel</button>
    </div>
  </div>

  <!-- Active Shift Card -->
  <div class="card" id="activeShiftCard" style="display:none">
    <div class="card-title">⏰ Active Shift</div>
    <div>Started: <span id="shiftStartTime"></span></div>
    <div>Location: <span id="shiftLocation"></span></div>
    <div class="btn-group">
      <button class="btn btn-danger" id="clockOutBtn">⏹ Clock Out</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="btn-group" style="margin-bottom: 16px;">
    <button class="btn btn-outline active-tab" data-tab="history" id="tabHistoryBtn">History</button>
    <button class="btn btn-outline" data-tab="receipts" id="tabReceiptsBtn">Receipts</button>
    <button class="btn btn-outline" data-tab="settings" id="tabSettingsBtn">Settings</button>
  </div>

  <!-- History Tab -->
  <div id="historyTab">
    <div class="card">
      <div class="card-title">📋 Recent Records</div>
      <div class="table-wrap">
        <table id="recordsTable">
          <thead>
            <tr><th>Type</th><th>Date</th><th>Details</th><th></th></tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
      </div>
      <button class="btn btn-outline" id="exportDataBtn">📎 Export Data</button>
    </div>
  </div>

  <!-- Receipts Tab -->
  <div id="receiptsTab" style="display:none">
    <div class="card">
      <div class="card-title">🧾 Capture Receipt</div>
      <input type="file" id="receiptImage" accept="image/*" capture="environment" />
      <input type="date" id="receiptDate" />
      <input type="text" id="receiptDesc" placeholder="Description (e.g., Parking - Hospital)" />
      <button class="btn btn-primary" id="saveReceiptBtn">Save to Drive</button>
    </div>
    <div class="card">
      <div class="card-title">📁 Receipts</div>
      <div id="receiptList"></div>
    </div>
  </div>

  <!-- Settings Tab -->
  <div id="settingsTab" style="display:none">
    <div class="card">
      <div class="card-title">🔧 Settings</div>
      <label>Arrival Radius (meters)</label>
      <input type="number" id="arrivalRadius" value="100" step="10" />
      <label>Google Drive Client ID</label>
      <input type="text" id="gdriveClientId" placeholder="Get from Google Cloud Console" />
      <button class="btn btn-primary" id="authGDriveBtn">🔐 Authenticate Drive</button>
      <div class="mt-2"></div>
      <button class="btn btn-outline" id="clearDeletedBtn">🗑 Permanently Clear Deleted</button>
    </div>
  </div>
</div>

<!-- Camera Modal -->
<div class="modal" id="cameraModal">
  <div class="modal-content">
    <div class="card-title" id="cameraTitle">Record Odometer</div>
    <video id="cameraVideo" autoplay playsinline class="camera-preview"></video>
    <canvas id="captureCanvas" style="display:none"></canvas>
    <input type="number" id="manualOdometer" placeholder="Or enter manually (km)" step="0.1" />
    <div class="btn-group">
      <button class="btn btn-primary" id="capturePhotoBtn">📸 Capture</button>
      <button class="btn btn-outline" id="closeCameraBtn">Cancel</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <div class="card-title">✏️ Edit Shift</div>
    <label>Start Time</label>
    <input type="datetime-local" id="editStart" />
    <label>End Time</label>
    <input type="datetime-local" id="editEnd" />
    <label>Location</label>
    <input type="text" id="editLocation" />
    <label>Notes</label>
    <textarea id="editNotes" rows="2"></textarea>
    <div class="btn-group">
      <button class="btn btn-primary" id="saveEditBtn">Save</button>
      <button class="btn btn-outline" id="closeEditBtn">Cancel</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toastMsg"></div>

<script>
// ==================== DATA STORAGE ====================
let records = [];
let deletedRecords = [];
let activeShift = null;
let activeTrip = null;
let currentEditId = null;
let pendingArrival = null; // { startOdometer, destination, targetLat, targetLng }
let watchPositionId = null;
let isAuthenticated = false;

// Load from localStorage
function loadData() {
  const saved = localStorage.getItem('workpal_records');
  if (saved) records = JSON.parse(saved);
  const deleted = localStorage.getItem('workpal_deleted');
  if (deleted) deletedRecords = JSON.parse(deleted);
  const shift = localStorage.getItem('workpal_activeShift');
  if (shift) activeShift = JSON.parse(shift);
  const trip = localStorage.getItem('workpal_activeTrip');
  if (trip) activeTrip = JSON.parse(trip);
}

function saveData() {
  localStorage.setItem('workpal_records', JSON.stringify(records));
  localStorage.setItem('workpal_deleted', JSON.stringify(deletedRecords));
  if (activeShift) localStorage.setItem('workpal_activeShift', JSON.stringify(activeShift));
  else localStorage.removeItem('workpal_activeShift');
  if (activeTrip) localStorage.setItem('workpal_activeTrip', JSON.stringify(activeTrip));
  else localStorage.removeItem('workpal_activeTrip');
}

function saveRecord(record) {
  record.id = Date.now().toString() + Math.random().toString(36).substr(2, 6);
  record.createdAt = Date.now();
  records.unshift(record);
  saveData();
  renderRecords();
  toast('Record saved', 'success');
}

function updateRecord(id, updates) {
  const index = records.findIndex(r => r.id === id);
  if (index !== -1) {
    records[index] = { ...records[index], ...updates };
    saveData();
    renderRecords();
    toast('Record updated', 'success');
  }
}

function softDeleteRecord(id) {
  const record = records.find(r => r.id === id);
  if (record && confirm('Move to trash? You can restore later.')) {
    records = records.filter(r => r.id !== id);
    deletedRecords.push({ ...record, deletedAt: Date.now() });
    saveData();
    renderRecords();
    toast('Moved to trash', 'warning');
  }
}

// ==================== GEOLOCATION & GEOFENCING ====================
function startGeofencing(targetLat, targetLng, radiusMeters, callback) {
  if (watchPositionId) navigator.geolocation.clearWatch(watchPositionId);
  
  watchPositionId = navigator.geolocation.watchPosition(
    (position) => {
      const distance = getDistance(
        position.coords.latitude, position.coords.longitude,
        targetLat, targetLng
      );
      if (distance <= radiusMeters) {
        navigator.geolocation.clearWatch(watchPositionId);
        watchPositionId = null;
        callback(true, distance);
      }
    },
    (error) => console.error('Geolocation error:', error),
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 }
  );
}

function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function getCurrentPosition() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 10000
    });
  });
}

// ==================== OCR (Tesseract) ====================
async function performOCR(imageData) {
  // Simple fallback - prompt manual entry if OCR fails
  toast('Processing image...', 'info');
  return new Promise((resolve) => {
    setTimeout(() => {
      const manual = prompt('OCR could not read clearly. Enter odometer reading (km):');
      resolve(manual ? parseFloat(manual) : null);
    }, 500);
  });
}

// ==================== TRIP MANAGEMENT ====================
document.getElementById('startTripBtn').addEventListener('click', async () => {
  const destination = prompt('Enter destination address or name:');
  if (!destination) return;
  
  toast('Getting your location...', 'info');
  try {
    const position = await getCurrentPosition();
    const destCoords = await geocodeAddress(destination);
    
    pendingArrival = {
      startOdometer: null,
      destination: destination,
      targetLat: destCoords.lat,
      targetLng: destCoords.lng,
      startLat: position.coords.latitude,
      startLng: position.coords.longitude
    };
    
    // Capture starting odometer
    showCameraModal('Record STARTING odometer', async (reading) => {
      pendingArrival.startOdometer = reading;
      activeTrip = {
        startTime: Date.now(),
        startOdometer: reading,
        destination: destination,
        startLat: position.coords.latitude,
        startLng: position.coords.longitude,
        targetLat: destCoords.lat,
        targetLng: destCoords.lng
      };
      saveData();
      updateUI();
      
      const radius = parseInt(document.getElementById('arrivalRadius').value) || 100;
      startGeofencing(destCoords.lat, destCoords.lng, radius, (arrived, distance) => {
        if (arrived) {
          toast(`Arrived at ${destination}! Recording ending odometer...`, 'success');
          showCameraModal('Record ENDING odometer', async (endReading) => {
            completeTrip(endReading);
          });
        }
      });
      
      toast(`Trip started. You'll be notified when you arrive within ${radius}m.`, 'success');
      updateUI();
    });
  } catch (error) {
    toast('Location error: ' + error.message, 'error');
  }
});

async function geocodeAddress(address) {
  // Mock geocoding - in production use Nominatim or Google Maps
  // For demo, return mock coordinates
  toast('Note: For full accuracy, enable location services and enter exact address.', 'info');
  return { lat: -33.8688, lng: 151.2093 }; // Sydney mock
}

function completeTrip(endOdometer) {
  if (!activeTrip) return;
  
  const distance = endOdometer - activeTrip.startOdometer;
  const record = {
    type: 'trip',
    destination: activeTrip.destination,
    startTime: activeTrip.startTime,
    endTime: Date.now(),
    startOdometer: activeTrip.startOdometer,
    endOdometer: endOdometer,
    distanceKm: distance,
    claimable: true,
    notes: `From ${activeTrip.startOdometer}km to ${endOdometer}km`
  };
  
  saveRecord(record);
  
  // Ask if at work
  if (confirm('Are you at work now? Click OK to start shift.')) {
    startManualShift(activeTrip.destination);
  }
  
  activeTrip = null;
  pendingArrival = null;
  if (watchPositionId) navigator.geolocation.clearWatch(watchPositionId);
  saveData();
  updateUI();
  toast(`Trip complete! ${distance.toFixed(1)} km travelled.`, 'success');
}

// ==================== SHIFT MANAGEMENT ====================
function startManualShift(location) {
  const loc = location || prompt('Enter work location:') || 'Unknown';
  activeShift = {
    startTime: Date.now(),
    location: loc,
    notes: ''
  };
  saveData();
  updateUI();
  toast(`Shift started at ${loc}`, 'success');
}

document.getElementById('manualClockBtn').addEventListener('click', () => {
  if (activeShift) {
    toast('Shift already active', 'warning');
    return;
  }
  startManualShift();
});

document.getElementById('clockOutBtn').addEventListener('click', () => {
  if (!activeShift) return;
  
  const record = {
    type: 'shift',
    location: activeShift.location,
    startTime: activeShift.startTime,
    endTime: Date.now(),
    duration: Date.now() - activeShift.startTime,
    notes: activeShift.notes
  };
  saveRecord(record);
  activeShift = null;
  saveData();
  updateUI();
  toast('Shift ended', 'success');
});

function editShift(record) {
  currentEditId = record.id;
  document.getElementById('editStart').value = formatDateTimeLocal(record.startTime);
  document.getElementById('editEnd').value = formatDateTimeLocal(record.endTime);
  document.getElementById('editLocation').value = record.location || '';
  document.getElementById('editNotes').value = record.notes || '';
  document.getElementById('editModal').classList.add('active');
}

function formatDateTimeLocal(timestamp) {
  const d = new Date(timestamp);
  return d.toISOString().slice(0, 16);
}

document.getElementById('saveEditBtn').addEventListener('click', () => {
  if (!currentEditId) return;
  const start = new Date(document.getElementById('editStart').value).getTime();
  const end = new Date(document.getElementById('editEnd').value).getTime();
  updateRecord(currentEditId, {
    startTime: start,
    endTime: end,
    duration: end - start,
    location: document.getElementById('editLocation').value,
    notes: document.getElementById('editNotes').value
  });
  document.getElementById('editModal').classList.remove('active');
  currentEditId = null;
});

// ==================== CAMERA MODAL ====================
let currentCameraCallback = null;
let mediaStream = null;

async function showCameraModal(title, callback) {
  currentCameraCallback = callback;
  document.getElementById('cameraTitle').textContent = title;
  document.getElementById('cameraModal').classList.add('active');
  
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('cameraVideo');
    video.srcObject = mediaStream;
  } catch (error) {
    toast('Camera access denied', 'error');
  }
}

document.getElementById('capturePhotoBtn').addEventListener('click', () => {
  const video = document.getElementById('cameraVideo');
  const canvas = document.getElementById('captureCanvas');
  const context = canvas.getContext('2d');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  context.drawImage(video, 0, 0, canvas.width, canvas.height);
  
  const manual = document.getElementById('manualOdometer').value;
  if (manual) {
    closeCameraModal(parseFloat(manual));
  } else {
    canvas.toBlob(async (blob) => {
      const reading = await performOCR(blob);
      closeCameraModal(reading);
    }, 'image/jpeg');
  }
});

function closeCameraModal(value) {
  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }
  document.getElementById('cameraModal').classList.remove('active');
  document.getElementById('manualOdometer').value = '';
  if (currentCameraCallback && value !== null && value !== undefined) {
    currentCameraCallback(value);
    currentCameraCallback = null;
  }
}

document.getElementById('closeCameraBtn').addEventListener('click', () => {
  closeCameraModal(null);
});

// ==================== RECEIPTS & GOOGLE DRIVE ====================
document.getElementById('saveReceiptBtn').addEventListener('click', async () => {
  const fileInput = document.getElementById('receiptImage');
  const date = document.getElementById('receiptDate').value;
  const desc = document.getElementById('receiptDesc').value;
  
  if (!fileInput.files[0] || !date) {
    toast('Select an image and date', 'warning');
    return;
  }
  
  if (!isAuthenticated) {
    toast('Please authenticate Google Drive first in Settings', 'warning');
    return;
  }
  
  toast('Saving to Drive...', 'info');
  // Drive API integration would go here
  // For demo, save locally
  const receipt = {
    id: Date.now(),
    date: date,
    description: desc,
    filename: `RECEIPT_${date.replace(/-/g, '')}_${Date.now()}.jpg`
  };
  localStorage.setItem(`receipt_${receipt.id}`, URL.createObjectURL(fileInput.files[0]));
  toast('Receipt saved (Demo: Drive integration requires OAuth setup)', 'success');
});

// ==================== UI RENDERING ====================
function updateUI() {
  const shiftText = activeShift ? `Active at ${activeShift.location}` : 'Inactive';
  const shiftStatus = document.getElementById('shiftStatusText');
  shiftStatus.textContent = shiftText;
  shiftStatus.className = activeShift ? 'status-value active' : 'status-value';
  
  document.getElementById('tripStatusText').textContent = activeTrip ? `To: ${activeTrip.destination}` : 'None';
  document.getElementById('tripStatusText').className = activeTrip ? 'status-value trip' : 'status-value';
  
  const activeTripCard = document.getElementById('activeTripCard');
  const activeShiftCard = document.getElementById('activeShiftCard');
  
  if (activeTrip) {
    activeTripCard.style.display = 'block';
    document.getElementById('tripDestinationDisplay').innerHTML = `<strong>Destination:</strong> ${activeTrip.destination}<br><strong>Start Odometer:</strong> ${activeTrip.startOdometer || 'Pending'} km`;
  } else {
    activeTripCard.style.display = 'none';
  }
  
  if (activeShift) {
    activeShiftCard.style.display = 'block';
    document.getElementById('shiftStartTime').textContent = new Date(activeShift.startTime).toLocaleString();
    document.getElementById('shiftLocation').textContent = activeShift.location;
  } else {
    activeShiftCard.style.display = 'none';
  }
}

function renderRecords() {
  const tbody = document.getElementById('recordsBody');
  const displayRecords = records.slice(0, 50);
  
  if (displayRecords.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No records</td></tr>';
    return;
  }
  
  tbody.innerHTML = displayRecords.map(r => `
    <tr>
      <td><span class="badge badge-${r.type}">${r.type === 'shift' ? 'Shift' : 'Trip'}</span></td>
      <td>${new Date(r.startTime || r.createdAt).toLocaleDateString()}</td>
      <td>${r.type === 'shift' ? r.location : `${r.distanceKm ? r.distanceKm.toFixed(1) + 'km' : 'Trip'} ${r.destination || ''}`}</td>
      <td>
        ${r.type === 'shift' ? `<button class="btn-outline" style="padding:4px 8px;font-size:11px" onclick='editShift(${JSON.stringify(r).replace(/'/g, "\\'")})'>✏️</button>` : ''}
        <button class="btn-outline" style="padding:4px 8px;font-size:11px" onclick='softDeleteRecord("${r.id}")'>🗑</button>
      </td>
    </tr>
  `).join('');
}

// Expose globals for onclick
window.editShift = editShift;
window.softDeleteRecord = softDeleteRecord;

// Tab switching
function switchTab(tab) {
  document.getElementById('historyTab').style.display = tab === 'history' ? 'block' : 'none';
  document.getElementById('receiptsTab').style.display = tab === 'receipts' ? 'block' : 'none';
  document.getElementById('settingsTab').style.display = tab === 'settings' ? 'block' : 'none';
}

document.getElementById('tabHistoryBtn').addEventListener('click', () => switchTab('history'));
document.getElementById('tabReceiptsBtn').addEventListener('click', () => switchTab('receipts'));
document.getElementById('tabSettingsBtn').addEventListener('click', () => switchTab('settings'));

document.getElementById('exportDataBtn').addEventListener('click', () => {
  const dataStr = JSON.stringify(records, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `workpal_data_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Data exported', 'success');
});

document.getElementById('arrivedBtn').addEventListener('click', () => {
  if (activeTrip) {
    const endReading = prompt('Enter ending odometer reading (km):');
    if (endReading) completeTrip(parseFloat(endReading));
  }
});

document.getElementById('cancelTripBtn').addEventListener('click', () => {
  if (confirm('Cancel current trip?')) {
    activeTrip = null;
    pendingArrival = null;
    if (watchPositionId) navigator.geolocation.clearWatch(watchPositionId);
    saveData();
    updateUI();
    toast('Trip cancelled', 'warning');
  }
});

document.getElementById('clearDeletedBtn').addEventListener('click', () => {
  if (confirm('Permanently delete ALL trashed records? This cannot be undone.')) {
    deletedRecords = [];
    saveData();
    toast('Deleted records cleared', 'success');
  }
});

document.getElementById('authGDriveBtn').addEventListener('click', () => {
  toast('Google Drive setup: See console for OAuth guide. For demo, using local storage.', 'info');
  isAuthenticated = true;
  document.getElementById('syncDot').className = 'sync-dot online';
  document.getElementById('syncText').textContent = 'Online (Demo)';
});

function toast(msg, type = 'info') {
  const toast = document.getElementById('toastMsg');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// Initialize
loadData();
updateUI();
renderRecords();
switchTab('history');
</script>
</body>
</html>
